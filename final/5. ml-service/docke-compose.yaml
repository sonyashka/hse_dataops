version: '3.8'

services:
  ml-service:
    build: .
    container_name: ml-service
    ports:
      - "8000:8000"
    volumes:
      # Монтируем код для разработки (опционально)
      - ./app:/app/app
      # Монтируем директорию для логов
      - ./logs:/app/logs
      # Монтируем директорию для данных
      - ./data:/app/data
    environment:
      - DB_PATH=/app/data/predictions.db
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    networks:
      - ml-network

networks:
  ml-network:
    driver: bridge