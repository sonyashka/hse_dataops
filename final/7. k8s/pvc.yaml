apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ml-service-data-pvc
  namespace: ml-service
  labels:
    app: ml-service
    component: data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: standard

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ml-service-logs-pvc
  namespace: ml-service
  labels:
    app: ml-service
    component: logs
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
  storageClassName: standard