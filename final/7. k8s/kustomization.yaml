apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ml-service

resources:
  - namespace.yaml
  - configmap.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - hpa.yaml

images:
  - name: ml-service
    newName: ml-service
    newTag: latest

configMapGenerator:
  - name: ml-service-config
    literals:
      - DB_PATH=/app/data/predictions.db
      - MODEL_VERSION=1.0.0
      - LOG_LEVEL=INFO
      - PYTHONUNBUFFERED=1

commonLabels:
  environment: production
  managed-by: kustomize

patchesStrategicMerge:
  # Можно добавить патчи для разных окружений
  # - patches/production.yaml