apiVersion: v1
kind: Service
metadata:
  name: ml-service
  namespace: ml-service
  labels:
    app: ml-service
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8000"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
    name: http
  selector:
    app: ml-service
    version: v1

---
apiVersion: v1
kind: Service
metadata:
  name: ml-service-headless
  namespace: ml-service
  labels:
    app: ml-service
spec:
  clusterIP: None
  ports:
  - port: 8000
    targetPort: 8000
    name: http
  selector:
    app: ml-service
    version: v1