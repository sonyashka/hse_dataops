version: '3.8'

services:
  db:
    image: postgres:15
    container_name: lakefs-db
    environment:
      - POSTGRES_DB=${LAKEFS_DATABASE_NAME}
      - POSTGRES_USER=${LAKEFS_DATABASE_USER}
      - POSTGRES_PASSWORD=${LAKEFS_DATABASE_PASSWORD}
    ports:
      - "5433:5432" 
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - lakefs-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LAKEFS_DATABASE_USER} -d ${LAKEFS_DATABASE_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: lakefs-minio
    ports:
      - "9000:9000"  
      - "9001:9001" 
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    networks:
      - lakefs-network
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  lakefs:
    image: treeverse/lakefs:latest
    container_name: lakefs-server
    ports:
      - "8000:8000" 
    environment:
      - LAKEFS_DATABASE_TYPE=postgres
      - LAKEFS_DATABASE_POSTGRES_CONNECTION_STRING=postgres://${LAKEFS_DATABASE_USER}:${LAKEFS_DATABASE_PASSWORD}@db:5432/${LAKEFS_DATABASE_NAME}?sslmode=disable
      
      - LAKEFS_BLOCKSTORE_TYPE=s3
      - LAKEFS_BLOCKSTORE_S3_REGION=${AWS_DEFAULT_REGION}
      - LAKEFS_BLOCKSTORE_S3_ENDPOINT=http://minio:9000
      - LAKEFS_BLOCKSTORE_S3_FORCE_PATH_STYLE=true
      - LAKEFS_BLOCKSTORE_S3_DISABLE_SSL=true
      
      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER}
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD}
      
      - LAKEFS_AUTH_ENCRYPT_SECRET_KEY=${LAKEFS_AUTH_ENCRYPT_SECRET_KEY}
      
      - LAKEFS_LOGGING_LEVEL=INFO
    volumes:
      - lakefs_data:/home/lakefs
    networks:
      - lakefs-network
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: ["lakefs", "run"]

networks:
  lakefs-network:
    driver: bridge

volumes:
  postgres_data:
  minio_data:
  lakefs_data: